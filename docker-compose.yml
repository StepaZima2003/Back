services:
  postgres:
    image: postgres:16-alpine
    container_name: socialsplit-postgres
    environment:
      POSTGRES_USER: socialsplit
      POSTGRES_PASSWORD: socialsplit
      POSTGRES_DB: socialsplit
    ports:
      - "5432:5432"
    volumes:
      - socialsplit-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialsplit -d socialsplit"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  socialsplit-postgres-data:

