openapi: 3.1.0
info:
  title: SocialSplitApp MVP API
  version: 0.1.0
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /auth/request-otp:
    post:
      summary: Request development OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
      responses:
        "200":
          description: OTP requested
  /auth/verify-otp:
    post:
      summary: Verify OTP and create or return user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, otp]
              properties:
                phone:
                  type: string
                otp:
                  type: string
      responses:
        "200":
          description: Authenticated
  /me:
    get:
      summary: Current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User
    patch:
      summary: Update current profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User
  /friends:
    get:
      summary: List friends
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Friends
  /friends/invite:
    post:
      summary: Invite friend by phone
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Friendship invitation
  /groups:
    get:
      summary: List groups
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Groups
    post:
      summary: Create group
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Group
  /payment-methods:
    get:
      summary: List current user payment methods
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Payment methods
  /payment-methods/mock-bind:
    post:
      summary: Bind masked mock payment method
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Payment method
  /payment-methods/{id}/revoke:
    post:
      summary: Revoke payment method
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Revoked payment method
  /autopay-rules:
    get:
      summary: List current user auto payment rules
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Auto payment rules
    post:
      summary: Create auto payment rule
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Auto payment rule
  /autopay-rules/{id}:
    patch:
      summary: Update auto payment rule
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Auto payment rule
  /groups/{id}/templates:
    get:
      summary: List group templates
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "200":
          description: Collection templates
    post:
      summary: Create group template
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "201":
          description: Collection template
  /collections:
    get:
      summary: List collections
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Collections
    post:
      summary: Create collection
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Collection
  /collections/{id}/categories:
    get:
      summary: List collection categories
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "200":
          description: Categories
    post:
      summary: Create collection category
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "201":
          description: Category
  /collections/{id}/participants:
    get:
      summary: List collection participants
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "200":
          description: Participants
    post:
      summary: Add participant
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "201":
          description: Participant
  /collections/{id}/participants/add-guest:
    post:
      summary: Add guest participant
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "201":
          description: Guest participant
  /collections/{id}/participants/add-child:
    post:
      summary: Add child participant with default 0.5 weight
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "201":
          description: Child participant
  /collections/{id}/calculate:
    post:
      summary: Calculate collection and persist calculation version
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "201":
          description: Calculation version
  /collections/{id}/calculations/latest:
    get:
      summary: Latest calculation version
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "200":
          description: Calculation version
  /collections/{id}/transfer-plan:
    get:
      summary: Latest transfer plan
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "200":
          description: Transfer plan
  /collections/{id}/responsible-payer-summary:
    get:
      summary: Latest responsible payer calculation summary
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "200":
          description: Responsible payer calculations
  /collections/{id}/participants/{participantId}/confirm-review:
    post:
      summary: Confirm participant calculation review
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CollectionId"
        - name: participantId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Confirmed participant
  /collections/{id}/disputes:
    get:
      summary: List collection disputes
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "200":
          description: Disputes
    post:
      summary: Create calculation dispute
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "201":
          description: Dispute
  /disputes/{id}/accept:
    post:
      summary: Organizer accepts dispute
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Accepted dispute
  /disputes/{id}/reject:
    post:
      summary: Organizer rejects dispute
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Rejected dispute
  /disputes/{id}/resolve:
    post:
      summary: Organizer resolves dispute by recalculation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Resolved dispute and new calculation version
  /collections/{id}/manual-payments/mark-paid:
    post:
      summary: Submit manual payment proof
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "201":
          description: Manual payment proof
  /collections/{id}/manual-payments:
    get:
      summary: List collection manual payments
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "200":
          description: Manual payment proofs
  /collections/{id}/payments:
    get:
      summary: List collection payment intents
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "200":
          description: Payment intents
  /collections/{id}/autopay/preview:
    get:
      summary: Preview collection auto payment execution plan
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "200":
          description: Auto payment preview
  /collections/{id}/autopay/execute:
    post:
      summary: Execute simulated collection auto payment batch
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "200":
          description: Auto payment execution result
  /collections/{id}/payments/mock-intents:
    post:
      summary: Create simulated payment intent
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "201":
          description: Payment intent
  /manual-payments/{id}/upload-proof:
    post:
      summary: Update manual payment proof URL or comment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Manual payment proof
  /manual-payments/{id}/confirm:
    post:
      summary: Confirm manual payment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Confirmed manual payment
  /manual-payments/{id}/reject:
    post:
      summary: Reject manual payment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Rejected manual payment
  /payments/{id}/simulate-success:
    post:
      summary: Simulate successful payment capture
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Payment intent
  /payments/{id}/simulate-failure:
    post:
      summary: Simulate failed payment capture
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Payment intent
  /payments/{id}/refund:
    post:
      summary: Simulate payment refund
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Refunded payment intent
  /payments/webhooks/{provider}:
    post:
      summary: Apply signed provider webhook event to payment intent
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [yookassa, bank, sbp, manual, other]
      responses:
        "200":
          description: Updated payment intent
  /payments/webhooks/mock-provider:
    post:
      summary: Legacy alias for mock bank-provider webhook event
      responses:
        "200":
          description: Updated payment intent
  /collections/{id}/audit-log:
    get:
      summary: List collection audit log
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "200":
          description: Audit log
  /notifications:
    get:
      summary: List current user notifications
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Notifications
  /notifications/{id}/read:
    post:
      summary: Mark notification as read
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Notification
  /internal/autopay/run-due:
    post:
      summary: Run due auto-payment sweep across eligible collections
      responses:
        "200":
          description: Sweep execution summary
  /internal/payments/webhooks/retry-failed:
    post:
      summary: Retry due failed provider webhooks and dead-letter terminal misses
      responses:
        "200":
          description: Webhook retry execution summary
  /internal/payments/webhooks/events:
    get:
      summary: List persisted provider webhook events for internal inspection
      responses:
        "200":
          description: Provider webhook events
  /internal/payments/webhooks/{eventId}/replay:
    post:
      summary: Replay one persisted provider webhook event regardless of retry schedule
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated provider webhook event
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    CollectionId:
      name: id
      in: path
      required: true
      schema:
        type: string
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
