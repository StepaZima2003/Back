name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and provider tests
        run: npm test

      - name: Build
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: socialsplit
          POSTGRES_PASSWORD: socialsplit
          POSTGRES_DB: socialsplit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U socialsplit -d socialsplit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://socialsplit:socialsplit@localhost:5432/socialsplit?schema=public
      TEST_DATABASE_URL: postgresql://socialsplit:socialsplit@localhost:5432/socialsplit?schema=integration

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Live PostgreSQL integration tests
        run: npm run test:integration
